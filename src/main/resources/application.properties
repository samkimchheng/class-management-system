spring.application.name=classroom
server.port=${PORT:8080}

# Database Connection (H2 File-based)
spring.datasource.url=jdbc:h2:file:./data/classroomDB;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Hibernate Configuration
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Console (/h2-console)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Multipart File Upload Limits (Allow up to 100MB MP3 files)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Enable JDBC Session storage to persist sessions across restarts & refreshes
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30d

# Servlet Session Cookie Persistence (30 Days timeout)
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.persistent=true

# Disable Thymeleaf cache for instant HTML reloads
spring.thymeleaf.cache=false
