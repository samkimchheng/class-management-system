<!DOCTYPE html>
<html lang="km" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូលប្រឡង - ប្រព័ន្ធគ្រប់គ្រងថ្នាក់រៀន</title>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --dark: #1e293b;
            --light: #f8fafc;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 8px;
        }
        body {
            font-family: 'Battambang', cursive;
            background-color: #f1f5f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            margin-top: 0;
            color: var(--dark);
        }
        .form-control {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-family: 'Battambang', cursive;
            font-size: 1.1rem;
            box-sizing: border-box;
        }
        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Battambang', cursive;
            font-size: 1.1rem;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #3730a3;
        }
        .error-msg {
            background-color: #fee2e2;
            color: var(--danger);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>ប្រព័ន្ធប្រឡងអនឡាញ</h2>
        <p style="color: #64748b; margin-bottom: 30px;">សូមបញ្ចូលលេខកូដសម្ងាត់របស់អ្នក ដើម្បីចូលរួមការប្រឡងប្រចាំខែ។</p>
        
        <div class="error-msg" th:if="${errorMessage}" th:text="${errorMessage}" style="display: block;"></div>
        
        <form th:action="@{/test/login}" method="post">
            <input type="text" name="studentCode" class="form-control" placeholder="លេខកូដសិស្ស..." required autofocus autocomplete="off">
            <button type="submit" class="btn-primary">ចូលប្រឡង</button>
        </form>
    </div>
</body>
</html>
